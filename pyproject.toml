[project]
name = "retinal-image-disease-classification"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["src*"] } }

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "kaggle>=2.2.5",
    "pre-commit>=4.7.0",
    "six>=1.17.0",
]
